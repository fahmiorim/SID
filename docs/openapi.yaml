openapi: 3.1.0
info:
  title: API Aplikasi Desa (Rebuild OpenSID)
  version: 0.1.0
  description: |
    Kontrak REST API untuk aplikasi desa hasil rebuild dari OpenSID (Next.js 15 + Drizzle + MySQL/MariaDB).
    Mencakup modul prioritas P0: Autentikasi & RBAC, Kependudukan, Keluarga/KK, Wilayah, Referensi,
    Persuratan (layanan surat), dan Laporan.

    **Konvensi**
    - Base path: `/api/v1`
    - Auth: `Authorization: Bearer <token>` (web juga mendukung cookie sesi).
    - Semua data ter-scope `config_id` (multi-desa); server menentukan `config_id` dari sesi/token.
    - Nilai enum numerik dipertahankan mengikuti OpenSID (lihat dokumen lampiran).
    - Pagination: `page` (1-based), `perPage` (maks 100), `q` (pencarian), `sort`.
    - Error memakai format `application/problem+json` (RFC 9457).
  contact:
    name: Tim Rebuild Desa
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: desa.example.id

tags:
  - name: Auth
    description: Autentikasi pengguna (admin & layanan mandiri)
  - name: Me
    description: Profil & hak akses pengguna aktif
  - name: Penduduk
  - name: Keluarga
  - name: Wilayah
  - name: Referensi
  - name: Surat
  - name: Laporan
  - name: Pengguna & RBAC
  - name: Pengaturan

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login pengguna
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
                otp: { type: string, description: Kode OTP bila 2FA aktif }
      responses:
        '200':
          description: Berhasil login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204': { description: Berhasil logout }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Me]
      summary: Profil pengguna aktif + permission
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /penduduk:
    get:
      tags: [Penduduk]
      summary: Daftar penduduk (terpaginasi)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: id_cluster
          in: query
          schema: { type: integer }
        - name: status_dasar
          in: query
          description: 1=Hidup,2=Mati,3=Pindah,4=Hilang,6=Pergi,9=Tidak Valid
          schema: { type: integer, enum: [1, 2, 3, 4, 6, 9] }
        - name: keluarga_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Penduduk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Penduduk]
      summary: Tambah penduduk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PendudukInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penduduk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /penduduk/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Penduduk]
      summary: Detail penduduk
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penduduk' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Penduduk]
      summary: Ubah penduduk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PendudukInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Penduduk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Penduduk]
      summary: Hapus penduduk (soft delete)
      responses:
        '204': { description: Dihapus }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tidak dapat dihapus (mis. masih menjadi kepala keluarga)

  /penduduk/{id}/peristiwa:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Penduduk]
      summary: Catat peristiwa penduduk
      description: |
        Mencatat peristiwa (lahir/mati/pindah/hilang/pergi). Memengaruhi `status_dasar` dan membuat
        entri `log_penduduk` (+ `log_keluarga` bila relevan).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeristiwaPendudukInput' }
      responses:
        '201':
          description: Tercatat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogPenduduk' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /keluarga:
    get:
      tags: [Keluarga]
      summary: Daftar keluarga
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: id_cluster
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Keluarga' }
    post:
      tags: [Keluarga]
      summary: Tambah kartu keluarga
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeluargaInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keluarga' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /keluarga/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Keluarga]
      summary: Detail keluarga + anggota
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeluargaDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Keluarga]
      summary: Ubah keluarga
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeluargaInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keluarga' }
    delete:
      tags: [Keluarga]
      summary: Hapus keluarga
      responses:
        '204': { description: Dihapus }
        '409':
          description: Masih memiliki anggota/bantuan/suplemen/analisis

  /wilayah:
    get:
      tags: [Wilayah]
      summary: Daftar wilayah (dusun/RW/RT)
      parameters:
        - name: parent
          in: query
          description: Filter berdasarkan dusun (kolom `dusun`)
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Wilayah' }

  /referensi/{jenis}:
    get:
      tags: [Referensi]
      summary: Ambil tabel referensi
      parameters:
        - name: jenis
          in: path
          required: true
          description: Nama referensi
          schema:
            type: string
            enum: [agama, pekerjaan, pendidikan-kk, pendidikan-sedang, status-kawin, shdk, warganegara, jenis-kelamin, status-penduduk, golongan-darah, cacat, asuransi, keluarga-sejahtera, cara-kb, sakit-menahun, rtm-hubungan, hamil]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Referensi' }

  /surat/jenis:
    get:
      tags: [Surat]
      summary: Daftar jenis/format surat aktif
      parameters:
        - name: mandiri
          in: query
          description: Hanya surat yang boleh diajukan via layanan mandiri
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JenisSurat' }

  /surat/permohonan:
    post:
      tags: [Surat]
      summary: Ajukan permohonan surat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermohonanSuratInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermohonanSurat' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /surat:
    get:
      tags: [Surat]
      summary: Daftar arsip surat (log_surat)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          description: '-1=Ditolak, 0=Konsep, 1=Cetak'
          schema: { type: integer, enum: [-1, 0, 1] }
        - name: id_format_surat
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogSurat' }

  /surat/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Surat]
      summary: Detail arsip surat
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogSurat' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Surat]
      summary: Ubah data surat (konsep)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogSuratInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogSurat' }

  /surat/{id}/verifikasi:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Surat]
      summary: Verifikasi bertingkat
      description: operator → sekdes → kades. Setiap level mengisi flag verifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, setuju]
              properties:
                level: { type: string, enum: [operator, sekdes, kades] }
                setuju: { type: boolean }
                catatan: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogSurat' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Status tidak memungkinkan verifikasi }

  /surat/{id}/terbitkan:
    parameters:
      - $ref: '#/components/parameters/PathId'
    post:
      tags: [Surat]
      summary: Terbitkan/cetak surat
      description: |
        Menetapkan nomor surat final (cek duplikat), status `Cetak`, membuat entri `urls` untuk QR bila diaktifkan.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogSurat' }
        '409': { $ref: '#/components/responses/Conflict' }

  /surat/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/PathId'
    get:
      tags: [Surat]
      summary: Unduh PDF surat
      responses:
        '200':
          description: Berkas PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /laporan/{jenis}:
    get:
      tags: [Laporan]
      summary: Data laporan
      parameters:
        - name: jenis
          in: path
          required: true
          schema:
            type: string
            enum: [penduduk, keluarga, kelahiran, kematian, pindah, bantuan, statistik]
        - name: dari
          in: query
          schema: { type: string, format: date }
        - name: sampai
          in: query
          schema: { type: string, format: date }
        - name: id_cluster
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /laporan/{jenis}/export:
    get:
      tags: [Laporan]
      summary: Ekspor laporan (PDF/Excel)
      parameters:
        - name: jenis
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, excel] }
        - name: dari
          in: query
          schema: { type: string, format: date }
        - name: sampai
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Berkas hasil ekspor
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /users:
    get:
      tags: [Pengguna & RBAC]
      summary: Daftar pengguna
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
    post:
      tags: [Pengguna & RBAC]
      summary: Tambah pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/PathId'
    patch:
      tags: [Pengguna & RBAC]
      summary: Ubah pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    delete:
      tags: [Pengguna & RBAC]
      summary: Hapus pengguna
      responses:
        '204': { description: Dihapus }

  /roles:
    get:
      tags: [Pengguna & RBAC]
      summary: Daftar role/grup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Pengguna & RBAC]
      summary: Tambah role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }

  /permissions:
    get:
      tags: [Pengguna & RBAC]
      summary: Katalog modul/permission (setting_modul)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Permission' }

  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/PathId'
    put:
      tags: [Pengguna & RBAC]
      summary: Set hak akses role
      description: Nilai akses mengikuti OpenSID 1=Baca, 3=Ubah(+Baca), 7=Hapus(+Ubah+Baca). 0=tidak ada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [permission_id, akses]
                    properties:
                      permission_id: { type: integer }
                      akses: { type: integer, enum: [0, 1, 3, 7] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RolePermission' }

  /pengaturan:
    get:
      tags: [Pengaturan]
      summary: Ambil pengaturan aplikasi & identitas desa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pengaturan' }
    put:
      tags: [Pengaturan]
      summary: Ubah pengaturan aplikasi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pengaturan' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pengaturan' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: q
      in: query
      schema: { type: string }

  responses:
    Unauthorized:
      description: Tidak terautentikasi
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Tidak memiliki hak akses
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Konflik data (mis. nomor surat duplikat / NIK sudah ada)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Validasi gagal
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginatedMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    AuthSession:
      type: object
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        nama: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              akses: { type: integer, enum: [0, 1, 3, 7] }
              can_read: { type: boolean }
              can_update: { type: boolean }
              can_delete: { type: boolean }
        batasi_wilayah: { type: boolean }
        akses_wilayah:
          type: array
          items: { type: integer }

    Referensi:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }

    Wilayah:
      type: object
      properties:
        id: { type: integer }
        rt: { type: string, nullable: true }
        rw: { type: string, nullable: true }
        dusun: { type: string, nullable: true }
        kepala_penduduk_id: { type: integer, nullable: true }
        lat: { type: string, nullable: true }
        lng: { type: string, nullable: true }

    Penduduk:
      type: object
      properties:
        id: { type: integer }
        config_id: { type: integer }
        nama: { type: string }
        nik: { type: string }
        keluarga_id: { type: integer, nullable: true }
        kk_level: { type: integer }
        rtm_level: { type: integer, nullable: true }
        jenis_kelamin: { type: integer, enum: [1, 2] }
        tempat_lahir: { type: string, nullable: true }
        tanggal_lahir: { type: string, format: date, nullable: true }
        agama_id: { type: integer, nullable: true }
        pendidikan_kk_id: { type: integer, nullable: true }
        pekerjaan_id: { type: integer, nullable: true }
        status_kawin: { type: integer, enum: [1, 2, 3, 4] }
        warganegara_id: { type: integer, enum: [1, 2, 3] }
        golongan_darah_id: { type: integer, nullable: true }
        id_cluster: { type: integer, nullable: true }
        status_penduduk: { type: integer, enum: [1, 2] }
        status_dasar: { type: integer, enum: [1, 2, 3, 4, 6, 9] }
        alamat_sekarang: { type: string, nullable: true }
        suku: { type: string, nullable: true }

    PendudukInput:
      type: object
      required: [nama, nik, jenis_kelamin, status_kawin, warganegara_id, status_dasar]
      properties:
        nama: { type: string, maxLength: 100 }
        nik: { type: string, pattern: '^[0-9]{16}$' }
        keluarga_id: { type: integer, nullable: true }
        kk_level: { type: integer, minimum: 1, maximum: 11 }
        jenis_kelamin: { type: integer, enum: [1, 2] }
        tempat_lahir: { type: string, nullable: true }
        tanggal_lahir: { type: string, format: date, nullable: true }
        agama_id: { type: integer, nullable: true }
        pendidikan_kk_id: { type: integer, nullable: true }
        pekerjaan_id: { type: integer, nullable: true }
        status_kawin: { type: integer, enum: [1, 2, 3, 4] }
        warganegara_id: { type: integer, enum: [1, 2, 3] }
        golongan_darah_id: { type: integer, nullable: true }
        id_cluster: { type: integer, nullable: true }
        status_penduduk: { type: integer, enum: [1, 2], default: 1 }
        status_dasar: { type: integer, enum: [1, 2, 3, 4, 6, 9], default: 1 }
        alamat_sekarang: { type: string, nullable: true }

    Keluarga:
      type: object
      properties:
        id: { type: integer }
        config_id: { type: integer }
        no_kk: { type: string }
        nik_kepala: { type: string, nullable: true }
        kelas_sosial_id: { type: integer, nullable: true }
        alamat: { type: string, nullable: true }
        id_cluster: { type: integer, nullable: true }
        tgl_daftar: { type: string, format: date-time, nullable: true }
        jumlah_anggota: { type: integer }

    KeluargaDetail:
      allOf:
        - $ref: '#/components/schemas/Keluarga'
        - type: object
          properties:
            anggota:
              type: array
              items: { $ref: '#/components/schemas/Penduduk' }

    KeluargaInput:
      type: object
      required: [no_kk, id_cluster]
      properties:
        no_kk: { type: string, pattern: '^[0-9]{16}$' }
        nik_kepala: { type: string, pattern: '^[0-9]{16}$', nullable: true }
        kelas_sosial_id: { type: integer, nullable: true }
        alamat: { type: string, nullable: true }
        id_cluster: { type: integer }

    JenisSurat:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }
        url_surat: { type: string }
        kode_surat: { type: string, nullable: true }
        jenis: { type: integer, enum: [3, 4], description: '3=Sistem, 4=Desa' }
        mandiri: { type: boolean }
        masa_berlaku: { type: integer, nullable: true }
        satuan_masa_berlaku: { type: string, nullable: true, enum: [H, M, B, T] }
        syarat:
          type: array
          items: { type: integer }
          description: daftar ref_syarat_id

    PermohonanSurat:
      type: object
      properties:
        id: { type: integer }
        config_id: { type: integer }
        penduduk_id: { type: integer }
        format_surat_id: { type: integer }
        isian_form: { type: object, additionalProperties: true, nullable: true }
        status: { type: integer, enum: [0, 1, 2, 3, 4, 5] }
        alasan: { type: string, nullable: true }
        keterangan: { type: string, nullable: true }
        no_hp_aktif: { type: string, nullable: true }
        no_antrian: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    PermohonanSuratInput:
      type: object
      required: [format_surat_id]
      properties:
        penduduk_id: { type: integer, description: 'Wajib untuk pemohon non-mandiri' }
        format_surat_id: { type: integer }
        isian_form: { type: object, additionalProperties: true }
        no_hp_aktif: { type: string, nullable: true }

    LogSurat:
      type: object
      properties:
        id: { type: integer }
        config_id: { type: integer }
        format_surat_id: { type: integer }
        penduduk_id: { type: integer, nullable: true }
        pamong_id: { type: integer, nullable: true }
        user_id: { type: integer, nullable: true }
        tanggal: { type: string, format: date-time }
        no_surat: { type: string, nullable: true }
        nama_surat: { type: string, nullable: true }
        status: { type: integer, enum: [-1, 0, 1] }
        tte: { type: boolean }
        verifikasi_operator: { type: boolean, nullable: true }
        verifikasi_sekdes: { type: boolean, nullable: true }
        verifikasi_kades: { type: boolean, nullable: true }
        nik_non_warga: { type: string, nullable: true }
        nama_non_warga: { type: string, nullable: true }
        url_verifikasi: { type: string, nullable: true, format: uri }

    LogSuratInput:
      type: object
      properties:
        format_surat_id: { type: integer }
        penduduk_id: { type: integer, nullable: true }
        pamong_id: { type: integer, nullable: true }
        tanggal: { type: string, format: date-time }
        keterangan: { type: string, nullable: true }
        isi_surat: { type: string, description: 'HTML hasil render (opsional)' }

    PeristiwaPendudukInput:
      type: object
      required: [kode_peristiwa]
      properties:
        kode_peristiwa:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
          description: '1=Baru Lahir,2=Mati,3=Pindah Keluar,4=Hilang,5=Baru Pindah Masuk,6=Tidak Tetap Pergi'
        tgl_peristiwa: { type: string, format: date-time }
        tgl_lapor: { type: string, format: date-time, nullable: true }
        catatan: { type: string, nullable: true }
        meninggal_di: { type: string, nullable: true }
        sebab: { type: string, nullable: true }
        alamat_tujuan: { type: string, nullable: true }
        ref_pindah: { type: integer, nullable: true, enum: [1, 2, 3, 4] }
        no_kk: { type: string, nullable: true }
        nama_kk: { type: string, nullable: true }

    LogPenduduk:
      type: object
      properties:
        id: { type: integer }
        config_id: { type: integer }
        penduduk_id: { type: integer }
        kode_peristiwa: { type: integer }
        tgl_peristiwa: { type: string, format: date-time }
        tgl_lapor: { type: string, format: date-time, nullable: true }
        catatan: { type: string, nullable: true }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        nama: { type: string }
        email: { type: string, nullable: true }
        active: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        pamong_id: { type: integer, nullable: true }

    UserInput:
      type: object
      required: [username, role_id]
      properties:
        username: { type: string }
        nama: { type: string }
        email: { type: string, format: email, nullable: true }
        password: { type: string, format: password, nullable: true }
        role_id: { type: integer }
        pamong_id: { type: integer, nullable: true }
        active: { type: boolean, default: true }

    Role:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }
        slug: { type: string }
        jenis: { type: integer, enum: [1, 2], description: '1=Sistem, 2=Desa' }

    RoleInput:
      type: object
      required: [nama, slug]
      properties:
        nama: { type: string }
        slug: { type: string }
        jenis: { type: integer, enum: [1, 2], default: 2 }

    Permission:
      type: object
      properties:
        id: { type: integer }
        nama: { type: string }
        slug: { type: string }
        url: { type: string, nullable: true }
        parent_id: { type: integer, nullable: true }
        aktif: { type: boolean }

    RolePermission:
      type: object
      properties:
        role_id: { type: integer }
        permission_id: { type: integer }
        akses: { type: integer, enum: [0, 1, 3, 7] }
        can_read: { type: boolean }
        can_update: { type: boolean }
        can_delete: { type: boolean }

    Pengaturan:
      type: object
      properties:
        identitas:
          type: object
          additionalProperties: true
        setting:
          type: object
          additionalProperties: true
