version: 2
updates:
  # Dependensi aplikasi (produksi & pengembangan).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Kelompokkan pembaruan minor/patch agar PR tidak membanjir.
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Action pihak ketiga pada workflow CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
